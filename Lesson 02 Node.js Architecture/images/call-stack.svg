<svg xmlns="http://www.w3.org/2000/svg" width="850" height="390" viewBox="0 0 850 390"><rect width="850" height="390" rx="20" fill="#f8fafc"/><text x="425.0" y="40" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#1e293b">Call Stack — LIFO</text><rect x="100" y="95" width="330" height="60" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="265.0" y="120" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#263445">first()</text><text x="265.0" y="141" text-anchor="middle" font-family="Arial" font-size="15" fill="#263445">Called first</text><rect x="100" y="177" width="330" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="265.0" y="202" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#263445">second()</text><text x="265.0" y="223" text-anchor="middle" font-family="Arial" font-size="15" fill="#263445">Called from first()</text><rect x="100" y="259" width="330" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="265.0" y="284" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#263445">third()</text><text x="265.0" y="305" text-anchor="middle" font-family="Arial" font-size="15" fill="#263445">Top of Stack — returns first</text><text x="590" y="170" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Push calls onto stack</text><text x="590" y="205" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Then return in reverse order</text><text x="590" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">third → second → first</text></svg>