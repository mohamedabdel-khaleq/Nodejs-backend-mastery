<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="24" fill="#0f172a"/><text x="450" y="48" fill="#f8fafc" font-size="28" font-family="Arial" text-anchor="middle" font-weight="bold">async / await with Promise-based I/O</text><rect x="80" y="105" width="210" height="70" rx="14" fill="#2563eb"/><text x="185" y="147" fill="white" font-size="22" text-anchor="middle" font-family="Arial">Call async function</text><path d="M290 140 H350" stroke="#94a3b8" stroke-width="4"/><path d="M340 130 L350 140 L340 150" stroke="#94a3b8" stroke-width="4" fill="none"/><rect x="350" y="105" width="200" height="70" rx="14" fill="#0d9488"/><text x="450" y="147" fill="white" font-size="22" text-anchor="middle" font-family="Arial">await I/O Promise</text><path d="M450 175 V235" stroke="#94a3b8" stroke-width="4"/><path d="M440 225 L450 237 L460 225" stroke="#94a3b8" stroke-width="4" fill="none"/><rect x="320" y="240" width="260" height="70" rx="14" fill="#7c3aed"/><text x="450" y="282" fill="white" font-size="22" text-anchor="middle" font-family="Arial">Continue after result</text><text x="450" y="350" fill="#cbd5e1" font-size="19" text-anchor="middle" font-family="Arial">Other event-loop work can run while the Promise is pending.</text></svg>