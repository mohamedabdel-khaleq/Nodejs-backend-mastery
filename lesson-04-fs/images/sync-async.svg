<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" rx="24" fill="#0f172a"/><text x="450" y="45" fill="#f8fafc" font-size="28" font-family="Arial" text-anchor="middle" font-weight="bold">Sync vs Async (simplified timeline)</text><text x="60" y="115" fill="#fbbf24" font-size="24" font-family="Arial" font-weight="bold">SYNC</text><line x1="60" y1="150" x2="840" y2="150" stroke="#64748b" stroke-width="3"/><rect x="100" y="125" width="180" height="50" rx="10" fill="#b45309"/><text x="190" y="157" fill="white" text-anchor="middle" font-size="20" font-family="Arial">Read file (blocks)</text><rect x="300" y="125" width="130" height="50" rx="10" fill="#2563eb"/><text x="365" y="157" fill="white" text-anchor="middle" font-size="20" font-family="Arial">Next code</text><text x="60" y="245" fill="#34d399" font-size="24" font-family="Arial" font-weight="bold">ASYNC</text><line x1="60" y1="280" x2="840" y2="280" stroke="#64748b" stroke-width="3"/><rect x="100" y="255" width="180" height="50" rx="10" fill="#0d9488"/><text x="190" y="287" fill="white" text-anchor="middle" font-size="20" font-family="Arial">Start read</text><rect x="300" y="255" width="130" height="50" rx="10" fill="#2563eb"/><text x="365" y="287" fill="white" text-anchor="middle" font-size="20" font-family="Arial">Next code</text><rect x="590" y="255" width="220" height="50" rx="10" fill="#7c3aed"/><text x="700" y="287" fill="white" text-anchor="middle" font-size="20" font-family="Arial">Callback after I/O</text><path d="M280 230 Q450 200 590 240" stroke="#34d399" stroke-width="3" fill="none" stroke-dasharray="8 8"/><text x="450" y="385" fill="#cbd5e1" font-size="20" text-anchor="middle" font-family="Arial">Async I/O allows the JS thread to do other work while waiting.</text><text x="450" y="425" fill="#94a3b8" font-size="17" text-anchor="middle" font-family="Arial">Conceptual diagram — not a literal internal execution trace</text></svg>