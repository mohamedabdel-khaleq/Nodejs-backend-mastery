<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" rx="20" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#0f172a">Encoding &amp; Decoding</text><rect x="60" y="105" width="220" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170" y="140" text-anchor="middle" font-family="Arial" font-size="23" fill="#1e40af">String</text><text x="170" y="170" text-anchor="middle" font-family="Arial" font-size="20" fill="#1e40af">“Hello”</text><path d="M300 150 H390" stroke="#475569" stroke-width="3"/><path d="M380 140 L395 150 L380 160" stroke="#475569" stroke-width="3" fill="none"/><text x="345" y="126" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">Encode</text><rect x="410" y="105" width="250" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="535" y="140" text-anchor="middle" font-family="Arial" font-size="23" fill="#166534">Buffer</text><text x="535" y="170" text-anchor="middle" font-family="Arial" font-size="19" fill="#166534">48 65 6c 6c 6f</text><path d="M680 150 H770" stroke="#475569" stroke-width="3"/><path d="M760 140 L775 150 L760 160" stroke="#475569" stroke-width="3" fill="none"/><text x="725" y="126" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">Decode</text><rect x="785" y="105" width="90" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="830" y="155" text-anchor="middle" font-family="Arial" font-size="20" fill="#92400e">Text</text><text x="450" y="245" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">UTF-8 is the default encoding for these string conversions</text></svg>