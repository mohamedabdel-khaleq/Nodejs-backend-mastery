itial contents</text><text x="240" y="329" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">Safer default for beginners</text><rect x="510" y="275" width="340" height="70" rx="12" fill="#e2e8f0"/><text x="680" y="305" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">Overwrite before reading / exposing</text><text x="680" y="329" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">May be faster in some cases</text></svg>