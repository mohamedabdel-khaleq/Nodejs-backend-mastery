<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340"><rect width="900" height="340" rx="18" fill="#f8fafc"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="27" fill="#123">Register → Emit → Execute</text><rect x="55" y="110" width="190" height="120" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="150" y="160" text-anchor="middle" font-family="Arial" font-size="22" fill="#123">Register</text><text x="150" y="195" text-anchor="middle" font-family="Arial" font-size="17" fill="#123">on(event, fn)</text><rect x="355" y="110" width="190" height="120" rx="16" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="450" y="160" text-anchor="middle" font-family="Arial" font-size="22" fill="#123">Trigger</text><text x="450" y="195" text-anchor="middle" font-family="Arial" font-size="17" fill="#123">emit(event)</text><rect x="655" y="110" width="190" height="120" rx="16" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="750" y="160" text-anchor="middle" font-family="Arial" font-size="22" fill="#123">Callback</text><text x="750" y="195" text-anchor="middle" font-family="Arial" font-size="17" fill="#123">Function runs</text></svg>